[build]
  command = "npx prisma generate && echo Building Functions"
  # If you have a frontend to build, use something like:
  # command = "npx prisma generate && npm run build"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "express",
    "cors",
    "dotenv",
    "swagger-ui-express",
    "serverless-http",
    "@prisma/client",   # ✅ Add this
    "prisma"            # ✅ Add this
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
